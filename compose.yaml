name: repo-x-ray
services:
  backend:
    build: ./backend
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 128
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${REPO_XRAY_PORT:-8080}:8080"
    depends_on:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
